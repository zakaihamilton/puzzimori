name: Verify Puzzimori
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run health
      - run: npm run health:styles
      - run: npm run audit:dependencies
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  visual-regression:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install chromium
      - run: npm run health:visual
        env:
          RUN_VISUAL_REGRESSION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
